<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验二 · 比例眼力 | 注意力糖果工坊</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #stage2 { position: relative; background: var(--card); }
  #cv { display: block; width: 100%; height: min(62vh, 560px); min-height: 420px; touch-action: none; border-radius: 0 0 var(--r-lg) var(--r-lg); }
  /* 数字作答条 */
  #num-panel {
    display: none; align-items: center; gap: 16px; justify-content: center;
    padding: 16px 24px; border-top: 3px dashed rgba(86,62,121,.2); flex-wrap: wrap;
  }
  #graphic-panel {
    display: none; align-items: center; gap: 22px; justify-content: center;
    padding: 16px 24px; border-top: 3px dashed rgba(86,62,121,.2); flex-wrap: wrap;
    background: linear-gradient(90deg, rgba(185,246,208,.35), rgba(189,239,255,.35));
  }
  #num-panel input[type=range] { width: min(420px, 60vw); accent-color: var(--pink-deep); height: 34px; }
  #num-val {
    font-family: var(--font-disp); font-size: 30px; min-width: 96px; text-align: center;
    background: var(--pink); border: 3px solid var(--ink); border-radius: var(--r-sm); padding: 2px 10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px">
    <h1 class="k-title" id="page-title" style="font-size:clamp(26px,4vw,40px)">实验二 · 比例眼力</h1>
    <span class="sticker" style="transform:rotate(-2deg)">🎨 B 是 A 的百分之几？</span>
  </div>

  <div class="progress-track" style="margin-bottom:18px"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="stage-shell">
    <div id="stage2">
      <canvas id="cv"></canvas>
      <div class="stage-hud">
        <span class="hud-pill" id="hud-trial">准备中…</span>
        <span class="hud-pill" id="hud-mode">—</span>
      </div>
      <div class="feedback-flash" id="feedback"><div class="fb-card">
        <div class="fb-icon"></div><div class="fb-title"></div><div class="fb-sub"></div>
      </div></div>
      <div class="overlay" id="overlay"><div class="card" id="overlay-card"></div></div>
    </div>
    <div id="num-panel">
      <span style="font-weight:900">拖动滑块估计：</span>
      <input type="range" id="num-slider" min="0" max="100" value="50" step="1">
      <span id="num-val">50%</span>
      <button class="btn btn-pink btn-sm" id="btn-confirm">确认答案</button>
    </div>
    <div id="graphic-panel">
      <span style="font-weight:900">🖐 拖动上方绿色图形，调成你的答案</span>
      <button class="btn btn-mint" id="btn-confirm-graphic">✔ 就是这个比例</button>
    </div>
  </div>

  <p style="text-align:center; color:var(--ink-soft); font-size:14px; margin-top:12px" id="mode-hint"></p>
</div>

<script src="js/common.js"></script>
<script src="js/exp2.js"></script>
</body>
</html>
